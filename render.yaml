services:
  - type: web
    name: aquaforma-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: aquaforma-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://aquaforma-site.onrender.com
      - key: FRONTEND_URL
        value: https://aquaforma-site.onrender.com
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_MAX_ONLINE_AMOUNT_CENTS
        value: "50000"
      - key: GROUP_COURSE_PRICE_EUR
        value: "2500"
      - key: PRIVATE_COURSE_PRICE_EUR
        value: "5000"
      - key: MAX_FILE_BYTES
        value: "26214400"
      - key: MAX_APPLICATION_UPLOAD_BYTES
        value: "52428800"

  - type: web
    name: aquaforma-site
    runtime: static
    buildCommand: python scripts/build_static.py
    staticPublishPath: dist
    envVars:
      - key: API_BASE_URL
        value: https://aquaforma-api-qoaz.onrender.com

databases:
  - name: aquaforma-db
    databaseName: aquaforma
    user: aquaforma_user
    plan: free
